name: Build PHP FPM Container and Upload to Dockerhub

on:
  workflow_call:
    secrets:
      DockerHubUser:
        required: false
      DockerHubPass:
        required: false
      ComposerAuth:
        required: false
      SentryToken:
        required: false
      SentryOrg:
        required: false
    inputs:
      buildLocal:
        required: false
        type: boolean
        default: true
      imageName:
        required: false
        type: string
      dockerFile:
        required: false
        type: string
        default: ./Dockerfile
      targets:
        required: false
        type: string
        # Define array as string because Github does not support arrays here at the moment
        default: "['production']"
      ecr:
        description: Also build-push to AWS ECR (single build, multi-registry)
        required: false
        type: boolean
        default: false
      aws-region:
        description: AWS region of the ECR registry
        required: false
        type: string
        default: eu-west-1
      aws-role-arn:
        description: IAM role ARN to assume for ECR push (OIDC, no static keys)
        required: false
        type: string
        default: ''
      ecr-repository:
        description: ECR repository name (defaults to imageName / repo name)
        required: false
        type: string
        default: ''
      dockerHub:
        description: Push to Docker Hub. Set false for ECR-only builds.
        required: false
        type: boolean
        default: true
      tagScheme:
        description: "Tag scheme. 'rentman' = rentman-main / rentman-{ver}-staging / -production."
        required: false
        type: string
        default: ''

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: assume the ECR push role (only used when ecr=true)
      contents: read
    strategy:
      matrix:
        target: ${{ fromJson(inputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker Login
        if: ${{ inputs.dockerHub }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DockerHubUser }}
          password: ${{ secrets.DockerHubPass }}
      ######################################################
      # ECR auth (OIDC) — only when ecr=true
      ######################################################
      - name: Configure AWS credentials
        if: ${{ inputs.ecr }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Login to Amazon ECR
        id: ecr
        if: ${{ inputs.ecr }}
        uses: aws-actions/amazon-ecr-login@v2
      ######################################################
      # Setting up final build tags
      ######################################################
      - name: Prepare Tags
        id: prep
        run: |
          IMAGE=elbgoodsgmbh/${{ inputs.imageName != '' && inputs.imageName || github.event.repository.name }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          ECR_REPO='${{ inputs.ecr-repository }}'
          [ -z "$ECR_REPO" ] && ECR_REPO='${{ inputs.imageName != '' && inputs.imageName || github.event.repository.name }}'
          echo "ecr_image=${{ steps.ecr.outputs.registry }}/${ECR_REPO}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Multi-registry: metadata-action emits the same tag set for each image,
          # so the single build below pushes to Docker Hub AND ECR — no second build.
          images: |
            ${{ inputs.dockerHub && steps.prep.outputs.image || '' }}
            ${{ inputs.ecr && steps.prep.outputs.ecr_image || '' }}
          flavor: |
            latest=false
          tags: |
            # Existing scheme — ALWAYS emitted (keeps Docker Hub / legacy deploys working)
            type=semver,pattern={{version}},suffix=-staging,enable=${{ matrix.target == 'staging' && github.event_name == 'release' }}
            type=semver,pattern={{version}},suffix=-test,enable=${{ matrix.target == 'test' && github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ matrix.target == 'production' }}

            type=ref,event=branch

            # `type=edge` with branch=$repo.default_branch did not emit the tag here, so
            # force it as a raw tag on default-branch production builds (same gate as latest).
            # The :edge tag is what the dev cluster's argocd-image-updater watches.
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', 'main') && matrix.target == 'production' }}

            type=raw,value=${{ matrix.target }},enable=${{ matrix.target == 'development' || matrix.target == 'test' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') && matrix.target == 'production' }}

            type=sha,prefix=sha-,enable=${{ inputs.ecr && matrix.target == 'production' }}

            # rentman scheme — ADDITIVE extra tags (opt-in via tagScheme=rentman) for the new cluster
            type=raw,value=rentman-main,enable=${{ inputs.tagScheme == 'rentman' && matrix.target == 'development' && github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern=rentman-{{version}}-staging,enable=${{ inputs.tagScheme == 'rentman' && matrix.target == 'staging' && github.event_name == 'release' }}
            type=semver,pattern=rentman-{{version}}-production,enable=${{ inputs.tagScheme == 'rentman' && matrix.target == 'production' && github.event_name == 'release' }}

      ######################################################
      # Setup Cache and BuildX
      ######################################################
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver-opts: network=host

      - name: Build and push
        id: docker_build
        if: ${{ !(matrix.target == 'development' && github.event_name == 'release') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          # Cache only on default-branch builds — tag/release builds produce a unique
          # cache key that is never reused, so caching them just wastes storage/time.
          cache-from: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'type=gha' || '' }}
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'type=gha,mode=max' || '' }}
          builder: ${{ steps.buildx.outputs.name }}
          file: ${{ inputs.dockerFile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMPOSER_AUTH=${{ secrets.ComposerAuth }}
            SENTRY_AUTH_TOKEN=${{ secrets.SentryToken }}
            CREATED_AT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  local:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && inputs.buildLocal == true && inputs.dockerHub == true
    needs: main
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DockerHubUser }}
          password: ${{ secrets.DockerHubPass }}
      ######################################################
      # Setting up final build tags
      ######################################################
      - name: Prepare Tags
        id: prep
        run: |
          IMAGE=elbgoodsgmbh/${{ inputs.imageName != '' && inputs.imageName || github.event.repository.name }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
      ######################################################
      # Setup Cache and BuildX
      ######################################################
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver-opts: network=host

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      ######################################################
      # Build!
      ######################################################
      - name: Build and push local
        id: docker_build_local
        uses: docker/build-push-action@v6
        with:
          no-cache: true
          builder: ${{ steps.buildx.outputs.name }}
          file: ${{ inputs.dockerFile }}
          target: local
          push: true
          tags: ${{ steps.prep.outputs.image }}:local
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMPOSER_AUTH=${{ secrets.ComposerAuth }}

  check-org:
    runs-on: ubuntu-latest
    outputs:
      check-org: ${{ steps.check-org.outputs.defined }}
    steps:
      - id: check-org
        if: ${{ env.SentryOrg != '' }}
        run: echo "defined=true" >> $GITHUB_OUTPUT
        env:
          SentryOrg: ${{ secrets.SentryOrg }}

  publish-sentry:
    runs-on: ubuntu-latest
    needs: [check-org]
    if: ${{ ( github.event_name == 'release' || github.event.action == 'created' ) && needs.check-org.outputs.check-org == 'true' }}
    steps:
    - uses: actions/checkout@v6
      with:
        show-progress: false

    - name: Prepare Project
      id: project
      run: |
        PROJECT=${GITHUB_REPOSITORY#*/}
        echo "project=${PROJECT}" >> $GITHUB_OUTPUT

    - name: Notify Sentry of new Release
      uses: getsentry/action-release@v3
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SentryToken }}
        SENTRY_ORG: ${{ secrets.SentryOrg }}
        SENTRY_PROJECT: ${{ steps.project.outputs.project }}
      with:
        set_commits: skip
        release: ${{ github.ref }}
